[package]
name = "desktop-tui"
description = "A desktop environment without graphics (tmux-like)"
version = "0.3.2"
edition = "2024"
authors = ["julien-cpsn"]
license = "MIT"
readme = "README.md"
publish = false
repository = "https://github.com/femboyvn/desktop-tui"
keywords = ["Desktop", "Environment", "TUI", "AppCUI-rs"]

[dependencies]
appcui = { path = "vendor/appcui", version = "0.4.6", features = ["CROSSTERM", "TRUE_COLORS"] }

virtual-terminal = "0.1.5"
# Reuse the PTY dependency's process-tree cleanup and await child reaping.
bmart = "0.2.12"

serde = { version = "1.0.228", features = ["derive"] }
toml = "1.0.3"

anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
chrono = { version = "0.4.44", features = ["now"] }
tokio = "1.49.0"
async-channel = "2.5.0"
walkdir = "2.5.0"
nestify = "0.3.3"
directories = "6.0.0"
argon2 = { version = "0.5.3", features = ["zeroize"] }
zeroize = "1.9"
libc = "0.2.175"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# Rust file decoders; the bundled miniaudio backend only handles sound output.
symphonia = { version = "=0.5.5", default-features = false, features = ["mp3", "pcm", "wav", "flac", "ogg", "vorbis"] }

[build-dependencies]
cc = "=1.2.36"
